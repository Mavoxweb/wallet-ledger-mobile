# Gera os ícones a partir de assets/icon (desenhados por tool/render_icon.py).
# Rodar: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon_square.png
  android: true
  ios: false
  min_sdk_android: 21
  # Ícone adaptativo: frente (o símbolo, com margem de segurança) + fundo.
  adaptive_icon_background: "#0F1413"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  # A frente já sai com a margem da zona segura (tool/render_icon.py).
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0F1413"
    theme_color: "#0F1413"
