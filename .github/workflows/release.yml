name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      # A versão do pubspec precisa bater com a tag (v0.1.0 ↔ version: 0.1.0+N).
      - name: Versão confere com a tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mas o pubspec diz $PUBSPEC"
            exit 1
          fi

      - name: Testes
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build web
        run: |
          flutter build web --release --pwa-strategy=none
          cd build/web && zip -qr "$GITHUB_WORKSPACE/wallet-ledger-web.zip" .

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk wallet-ledger.apk
          gh release create "$GITHUB_REF_NAME" \
            wallet-ledger.apk wallet-ledger-web.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
