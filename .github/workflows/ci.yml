name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      # Regenera o cliente a partir do contrato fixado em contract.version.
      # Se o código commitado for diferente, alguém editou o gerado à mão ou
      # mudou a versão do contrato sem regenerar.
      - name: Cliente da API atualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tool/generate_api.sh
          if ! git diff --exit-code -- packages/; then
            echo "::error::Cliente desatualizado: rode 'bash tool/generate_api.sh' e commite packages/"
            exit 1
          fi

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build web
        run: flutter build web --release

  android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-ledger.apk
          path: build/app/outputs/flutter-apk/app-release.apk
